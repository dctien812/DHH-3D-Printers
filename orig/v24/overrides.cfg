############################################# \
######## USER CONFIG OVERRIDES FILE #########  + --> This will help you personalize my config to your printer :)
############################################# /

# This file is yours! Feel free to edit it in order to include all the needed
# things to adapt my generic config to your machine. This file will not be erased
# when updating the config using moonraker and it will be kept as you've set it.
# Full documentation: docs/overrides.md in the Klippain folder.

### Reminder: aliases are defined in mcu.cfg ([board_pins]), and because Klipper does not
### allow pin modifiers (!, ^, ~) inside a [board_pins] section, the modifiers are applied
### here instead. Pins on the toolhead MCU must be written as "toolhead:ALIAS".

### Only real differences from the Klippain defaults are kept in this file. Lines that
### merely repeated a Klippain default were removed - see the list near the bottom.

### Voron 2.4 300: Orbiter 2.5 + Rapido 2 UHF (PT1000) on an EBB36 Gen2, LLL Plus buffer,
### Orbiter Smart Sensor. Everything for the LLL Plus buffer and the OSS lives in
### lll_plus_oss.cfg, included on the LAST line of this file.

# ------------------------------------------------------------------------------------------


#-------------------------#
#   START_PRINT SEQUENCE  #
#-------------------------#

## Overrides the list set by config/hardware/probes/cartographer_touch.cfg:
## - "clean" runs BEFORE contact_z_home, so the nozzle is clean when it touches the bed.
## - "skew_load" (macro just below) runs last, after every move near the bed edges
##   (purge bucket, brush, prime line), as the Klipper skew docs recommend.
## Available actions and custom _START_PRINT_ACTION_<NAME> macros: docs/overrides.md.
[gcode_macro _USER_VARIABLES]
variable_startprint_actions: "bed_soak", "extruder_preheating", "chamber_soak", "tilt_calib", "clean", "contact_z_home", "bedmesh", "extruder_heating", "purge", "clean", "primeline", "skew_load"
gcode: # do not remove this line

## The Califlower skew profile in the SAVE_CONFIG block of printer.cfg is never loaded by
## Klipper or Klippain on its own. This applies it for every print. Remove "skew_load"
## above if your slicer start G-code already runs SKEW_PROFILE LOAD=Califlower.
[gcode_macro _START_PRINT_ACTION_SKEW_LOAD]
description: Apply the Califlower skew correction profile
gcode:
    SKEW_PROFILE LOAD=Califlower


#-------------------------#
#   EXTRUDER/BED PIDs     #
#-------------------------#

## Klippain's orbiter2.0.cfg sets ATC Semitec 104GT-2 / max_temp 270, hence the two
## sensor overrides here for the Rapido 2 UHF PT1000 (the hotend is rated to 350C, 300
## keeps a safety margin). The PT1000 reads through the EBB36 Gen2 TH0 2.2k pull-up
## (pullup_resistor: 2200 in mcu.cfg). control/pid values come from your own PID tuning.
[extruder]
control: pid
pid_kp: 32.941
pid_ki: 5.490
pid_kd: 49.413
sensor_type: PT1000
max_temp: 300

[heater_bed]
control: pid
pid_kp: 58.316
pid_ki: 3.927
pid_kd: 216.499


#-------------------------#
#   MOTOR DIRECTIONS      #
#   AND AXIS LIMITS       #
#-------------------------#

## Klippain wires the axis with non-inverted dir_pin by default, so only the motors
## that actually needed flipping appear here. Z1 and Z3 are not listed because they
## run in the default direction.
[stepper_x]
dir_pin: !X_DIR
microsteps: 64   # Klippain default is 32

[stepper_y]
dir_pin: !Y_DIR
endstop_pin: ^Y_STOP   # adds the pull-up that a [board_pins] alias cannot carry
microsteps: 64   # Klippain default is 32

[stepper_z]
dir_pin: !Z_DIR
position_max: 245   # Klippain's 300mm.cfg allows 260

[stepper_z2]
dir_pin: !Z2_DIR


#-------------------------#
#   TMC DRIVERS           #
#-------------------------#

## Orbiter 2.5 (LDO 36STH20-1004AHG). Klippain's TMC2209.cfg ships 0.45 A, which its own
## orbiter2.0.cfg calls too low (it points to 0.85 A). 0.65 A is your value - raise it
## toward 0.85 A if the extruder ever clicks at high flow. Interpolation off, as Orbiter
## recommends. Orbiter 2.5 uses the 2.0 rotation_distance (4.637) as a starting point.
## X/Y stay on Klippain's TMC2209 0.8 A (0.9 deg LDO 42STH48-2004MAH, see autotune below).
[tmc2209 extruder]
run_current: 0.65
interpolate: False


#---------------------------------------#
#   Autotune TMC                        #
#---------------------------------------#
[autotune_tmc stepper_x]
motor: ldo-42sth48-2004mah

[autotune_tmc stepper_y]
motor: ldo-42sth48-2004mah

[autotune_tmc extruder]
motor: ldo-36sth20-1004ahg


#-------------------------#
#   QUAD GANTRY LEVEL     #
#-------------------------#
[quad_gantry_level]
retries: 8              # Klippain default is 5
retry_tolerance: 0.009  # Klippain default is 0.0075


#-------------------------#
#      INPUT SHAPER       #
#-------------------------#
[resonance_tester]
probe_points:
    150,128,20
accel_per_hz: 100
sweeping_accel: 400
sweeping_period: 0

## Values from your own Shake&Tune run - kept as one complete block
## (shaper_type_y happens to match the Klippain default).
[input_shaper]
shaper_freq_x: 85.4 # center frequency for the X axis filter
shaper_type_x: mzv # filter type for the X axis
shaper_freq_y: 59.6 # center frequency for the Y axis filter
shaper_type_y: mzv # filter type for the Y axis
damping_ratio_x: 0.067 # damping ratio for the X axis
damping_ratio_y: 0.043 # damping ratio for the Y axis


#-------------------------#
#   Verify Heater         #
#-------------------------#
## Klippain does not define any [verify_heater], so these override Klipper's own
## defaults (max_error 120, hysteresis 5, heating_gain 2, check_gain_time 20 extruder /
## 60 bed). Keep the extruder max_error at 120: it is what caught the PT1000 wiring fault.
[verify_heater heater_bed]
max_error: 500
check_gain_time: 120
heating_gain: 1

[verify_heater extruder]
max_error: 120
check_gain_time: 30
hysteresis: 10
#check_gain_time: 60 # uncomment for mpc test
#hysteresis: 30 # uncomment for mpc test


#-------------------------#
#      CARTOGRAPHER       #
#-------------------------#
[cartographer]
y_offset: 21   # Klippain's cartographer_touch.cfg ships 15


#---------------------------#
#      MISC                 #
#---------------------------#
[temperature_sensor Chamber]
sensor_type: Generic 3950   # Klippain ships ATC Semitec 104GT-2

[printer]
square_corner_velocity: 10.0   # Klippain's corexy.cfg ships 5.0

[neopixel caselight]
chain_count: 18   # Klippain ships 31


#--------------------------------------------------------------------------------------
# Removed from this file because each line was identical to what Klippain already sets
# (kept here as a record, in case you ever wonder where they went):
#
#   [stepper_x] step_pin PC13 / enable_pin !PE6      -> X_STEP / !X_ENABLE
#   [stepper_y] step_pin PE4 / enable_pin !PE3       -> Y_STEP / !Y_ENABLE
#   [stepper_x] [stepper_y] rotation_distance: 40    -> already 40 in 0.9deg_1M.cfg
#   [stepper_x] [stepper_y] full_steps_per_rotation: 400 -> already 400
#   [stepper_z1] dir_pin: Z1_DIR                     -> already the default direction
#   [stepper_z3] dir_pin: Z3_DIR                     -> already the default direction
#   [quad_gantry_level] max_adjust: 10               -> already 10 in qgl_300mm.cfg
#   [resonance_tester] accel_chip: adxl345           -> set by adxl345_cartographer_v3.cfg
#   [cartographer] x_offset: 0 / verbose: no         -> same values in cartographer_touch.cfg
#   [tmc2209 extruder/stepper_z/z1/z2/z3] sense_resistor: 0.110 -> 0.110 in every
#       Klippain TMC2209 file
#   the duplicated commented-out "Z MOTORS DIRECTION" and "Probe Offsets" template blocks
#
# Also removed on 2026-10-30:
#   - the LLL Plus block and the LOAD/UNLOAD_FILAMENT overrides: moved, with the OSS,
#     into lll_plus_oss.cfg (they would otherwise be defined twice)
#   - the commented-out [tmc5160 stepper_x/y] run_current 1.4 block: this machine has
#     TMC2209 drivers (mcu.cfg) and 0.9 deg 42STH48-2004MAH motors, not 2804AH
#--------------------------------------------------------------------------------------


#----------------------------------------------#
#   LLL Plus buffer + Orbiter Smart Sensor     #
#----------------------------------------------#
## Keep this as the LAST line: lll_plus_oss.cfg replaces Klippain's LOAD_FILAMENT /
## UNLOAD_FILAMENT and its filament sensor list, so it must come after everything else.
[include lll_plus_oss.cfg]
