# =====================================================================
#  TEST_SPEED - kiem tra truot buoc (skipped steps) cho truc X/Y
# ---------------------------------------------------------------------
#  Dua tren macro TEST_SPEED cua Andrew Ellis (Ellis' Print Tuning Guide)
#  https://github.com/AndrewEllis93/Print-Tuning-Guide
#
#  Da chinh lai cho Trident (CoreXY) chay Klippain:
#   - Chi G28 toan bo khi may chua home du XYZ (do Z bang Cartographer 1 lan)
#   - Nang Z len 30 mm truoc khi chay XY
#   - Home lai cuoi bai chi can G28 X Y (CoreXY khong can G28 toan bo)
#   - In dong "LAN 1 / LAN 2" truoc moi GET_POSITION cho de so sanh
#
#  CAI DAT
#   1. Upload file nay vao thu muc config (cung cho voi printer.cfg)
#   2. Them dong sau vao cuoi overrides.cfg:
#        [include TEST_SPEED.cfg]
#   3. SAVE & RESTART
#
#  CACH DUNG (go trong console)
#   TEST_SPEED                                  -> dung max_velocity, max_accel trong config, 5 vong
#   TEST_SPEED ITERATIONS=10
#   TEST_SPEED SPEED=350 ACCEL=8000 ITERATIONS=10
#   Tham so phu: BOUND (mm, mac dinh 20), SMALLPATTERNSIZE (mm, mac dinh 20),
#                MIN_CRUISE_RATIO (mac dinh 0.5)
#
#  DOC KET QUA
#   Macro chay GET_POSITION 2 lan: LAN 1 (truoc khi test) va LAN 2 (sau khi test).
#   So sanh so cua stepper_x va stepper_y o dong "mcu:" giua 2 lan.
#   - Chenh khong qua 1 buoc day du (= so microsteps, hien tai la 32) -> DAT
#   - Chenh nhieu hon -> co truot buoc: tang run_current hoac giam ACCEL / SPEED
# =====================================================================

[gcode_macro TEST_SPEED]
description: Kiem tra truot buoc X/Y. Home, GET_POSITION, chay nhanh, home lai, GET_POSITION
gcode:
    # ---- Tham so ----
    {% set speed = params.SPEED|default(printer.configfile.settings.printer.max_velocity)|int %}
    {% set iterations = params.ITERATIONS|default(5)|int %}
    {% set accel = params.ACCEL|default(printer.configfile.settings.printer.max_accel)|int %}
    {% set min_cruise_ratio = params.MIN_CRUISE_RATIO|default(0.5)|float %}
    # Lui vao trong BOUND mm so voi mep, lo co truot vai buoc cung khong dam vao khung
    {% set bound = params.BOUND|default(20)|int %}
    # Kich thuoc o vuong nho o giua ban
    {% set smallpatternsize = params.SMALLPATTERNSIZE|default(20)|int %}
    {% set safe_z = bound + 10 %}
    {% set usteps = printer.configfile.settings.stepper_x.microsteps %}

    # ---- Vung chay lon (lui vao BOUND mm) ----
    {% set x_min = printer.toolhead.axis_minimum.x %}
    {% if x_min < 0 %}
        {% set x_min = 0 %}
    {% endif %}
    {% set y_min = printer.toolhead.axis_minimum.y %}
    {% if y_min < 0 %}
        {% set y_min = 0 %}
    {% endif %}
    {% set x_min = x_min + bound %}
    {% set x_max = printer.toolhead.axis_maximum.x - bound %}
    {% set y_min = y_min + bound %}
    {% set y_max = printer.toolhead.axis_maximum.y - bound %}

    # ---- O vuong nho o giua ban ----
    {% set x_center = (printer.toolhead.axis_minimum.x|float + printer.toolhead.axis_maximum.x|float) / 2 %}
    {% set y_center = (printer.toolhead.axis_minimum.y|float + printer.toolhead.axis_maximum.y|float) / 2 %}
    {% set x_center_min = x_center - (smallpatternsize / 2) %}
    {% set x_center_max = x_center + (smallpatternsize / 2) %}
    {% set y_center_min = y_center - (smallpatternsize / 2) %}
    {% set y_center_max = y_center + (smallpatternsize / 2) %}

    SAVE_GCODE_STATE NAME=TEST_SPEED
    RESPOND TYPE=command MSG="TEST_SPEED: {iterations} vong, speed {speed} mm/s, accel {accel} mm/s2"

    # ---- Home va lay vi tri LAN 1 ----
    M400
    {% if printer.toolhead.homed_axes != "xyz" %}
        G28
    {% endif %}
    G90
    G0 Z{safe_z} F600
    # Ra xa endstop 50 mm roi home lai X Y de lay moc chinh xac
    G1 X{printer.toolhead.axis_maximum.x - 50} Y{printer.toolhead.axis_maximum.y - 50} F{30*60}
    M400
    G28 X Y
    G90
    G0 X{printer.toolhead.axis_maximum.x - 1} Y{printer.toolhead.axis_maximum.y - 1} F{30*60}
    G4 P1000
    RESPOND TYPE=command MSG="----- LAN 1: vi tri TRUOC khi test -----"
    GET_POSITION

    # ---- Chay test ----
    G0 X{x_min} Y{y_min} Z{safe_z} F{speed*60}
    {% if printer.configfile.settings.printer.minimum_cruise_ratio is defined %}
        SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} MINIMUM_CRUISE_RATIO={min_cruise_ratio}
    {% else %}
        SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} ACCEL_TO_DECEL={accel / 2}
    {% endif %}

    {% for i in range(iterations) %}
        # Duong cheo lon (moi duong cheo chi co 1 motor quay)
        G0 X{x_min} Y{y_min} F{speed*60}
        G0 X{x_max} Y{y_max} F{speed*60}
        G0 X{x_min} Y{y_min} F{speed*60}
        G0 X{x_max} Y{y_min} F{speed*60}
        G0 X{x_min} Y{y_max} F{speed*60}
        G0 X{x_max} Y{y_min} F{speed*60}
        # Hinh vuong lon
        G0 X{x_min} Y{y_min} F{speed*60}
        G0 X{x_min} Y{y_max} F{speed*60}
        G0 X{x_max} Y{y_max} F{speed*60}
        G0 X{x_max} Y{y_min} F{speed*60}
        # Duong cheo nho o giua
        G0 X{x_center_min} Y{y_center_min} F{speed*60}
        G0 X{x_center_max} Y{y_center_max} F{speed*60}
        G0 X{x_center_min} Y{y_center_min} F{speed*60}
        G0 X{x_center_max} Y{y_center_min} F{speed*60}
        G0 X{x_center_min} Y{y_center_max} F{speed*60}
        G0 X{x_center_max} Y{y_center_min} F{speed*60}
        # Hinh vuong nho o giua
        G0 X{x_center_min} Y{y_center_min} F{speed*60}
        G0 X{x_center_min} Y{y_center_max} F{speed*60}
        G0 X{x_center_max} Y{y_center_max} F{speed*60}
        G0 X{x_center_max} Y{y_center_min} F{speed*60}
    {% endfor %}

    # ---- Tra lai gioi han toc do / gia toc trong config ----
    {% if printer.configfile.settings.printer.minimum_cruise_ratio is defined %}
        SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} MINIMUM_CRUISE_RATIO={printer.configfile.settings.printer.minimum_cruise_ratio}
    {% else %}
        SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} ACCEL_TO_DECEL={printer.configfile.settings.printer.max_accel_to_decel}
    {% endif %}

    # ---- Home lai X Y va lay vi tri LAN 2 ----
    M400
    G28 X Y
    G90
    G0 X{printer.toolhead.axis_maximum.x - 1} Y{printer.toolhead.axis_maximum.y - 1} F{30*60}
    G4 P1000
    RESPOND TYPE=command MSG="----- LAN 2: vi tri SAU khi test -----"
    GET_POSITION
    RESPOND TYPE=command MSG="So sanh stepper_x va stepper_y o dong mcu: giua LAN 1 va LAN 2. Chenh khong qua {usteps} la DAT, nhieu hon la co truot buoc."

    RESTORE_GCODE_STATE NAME=TEST_SPEED
