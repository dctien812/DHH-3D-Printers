#################################################################################
#  Orbiter 2 Smart Sensor (OSS) - Voron Trident 250 (Klippain)
#################################################################################
#
# Included at the end of overrides.cfg:   [include oss_only.cfg]
# Pin aliases OSS_SENSOR / OSS_BUTTON are in mcu.cfg ([board_pins ebb36_gen2_mcu]),
# EBB36 Gen2 I2C port, wiring checked on the machine:
#   OSS_SENSOR = MCU_I2C_SCL (PA7)  <- OSS "FS":  high = filament present
#   OSS_BUTTON = MCU_I2C_SDA (PA6)  <- OSS "FTU": short high pulse = unload button,
#                                      or a tangle (pull force over ~2 kg for 1 s)
#   OSS 5V / GND -> I2C port 5V / GND
# The OSS has its own small MCU that debounces both signals and drives them push-pull,
# so the pins need no pull-up and the event delays can stay short.
#
# The OSS IS Klippain's "runout_sensor": config/hardware/filament_sensors/switch_sensor.cfg
# (included in printer.cfg) creates that sensor and the Klippain helper macros, and only
# its pin is moved here from the mainboard FWS0 port to the OSS. So Klippain switches it
# on and off by itself: per material in START_PRINT ('filament_sensor' in
# variables.cfg, 0 for TPU), around LOAD/UNLOAD_FILAMENT, and back on at END_PRINT.
#
# Behaviour (the official Orbiter2_SmartSensor.cfg v3.2.0, adapted to Klippain):
#   - filament reaches the OSS while not printing (also while paused) -> LOAD_FILAMENT
#   - OSS button while not printing (also while paused)               -> UNLOAD_FILAMENT
#   - OSS button signal while printing = tangle                        -> PAUSE
#     (ignored while Klippain has the filament sensor disabled, e.g. TPU)
#   - no filament at the OSS while printing                            -> PAUSE
# LOAD_FILAMENT / UNLOAD_FILAMENT, PAUSE / RESUME are Klippain's own.
# Console check: QUERY_FILAMENT_SENSOR SENSOR=runout_sensor

[filament_switch_sensor runout_sensor]
switch_pin: toolhead:OSS_SENSOR
pause_on_runout: True
runout_gcode:
    RESPOND TYPE=error MSG="OSS: no filament at the extruder, print paused"
insert_gcode:
    _OSS_INSERT
event_delay: 0.1
pause_delay: 0.1

[gcode_button oss_button]
pin: toolhead:OSS_BUTTON
press_gcode:
    _OSS_BUTTON

# ---------------------------------------------------------------------------
# One place to switch the OSS functions on or off.
# ---------------------------------------------------------------------------
[gcode_macro _OSS_VARS]
description: Settings for the Orbiter 2 Smart Sensor
variable_autoload: 1        # 1 = load automatically when filament reaches the OSS
variable_unload_button: 1   # 1 = the OSS button runs UNLOAD_FILAMENT
variable_tangle_pause: 1    # 1 = pause the print when the OSS reports a tangle
variable_busy: 0            # internal flag, do not change
gcode:

[gcode_macro _OSS_INSERT]
description: OSS insert event - load the new filament
gcode:
    {% set v = printer["gcode_macro _OSS_VARS"] %}
    {% if v.busy|int == 1 %}
        RESPOND MSG="OSS: filament detected, ignored (a load or unload is still running)"
    {% elif v.autoload|int == 1 %}
        {% set heater_was_off = printer.print_stats.state != "paused" and printer.extruder.target == 0 %}
        SET_GCODE_VARIABLE MACRO=_OSS_VARS VARIABLE=busy VALUE=1
        RESPOND MSG="OSS: filament detected, loading"
        LOAD_FILAMENT
        {% if heater_was_off %}
            M104 S0
        {% endif %}
        UPDATE_DELAYED_GCODE ID=_OSS_CLEAR_BUSY DURATION=2
    {% else %}
        RESPOND MSG="OSS: filament detected (autoload is 0, nothing done)"
    {% endif %}

[gcode_macro _OSS_BUTTON]
description: OSS button - unload when idle or paused, tangle alarm while printing
gcode:
    {% set v = printer["gcode_macro _OSS_VARS"] %}
    {% set sensor_enabled = printer["filament_switch_sensor runout_sensor"].enabled %}
    {% if printer.print_stats.state == "printing" %}
        {% if v.tangle_pause|int == 1 and sensor_enabled %}
            RESPOND TYPE=error MSG="OSS: filament tangle detected, print paused"
            PAUSE
        {% else %}
            RESPOND MSG="OSS: tangle signal ignored (tangle_pause is 0 or the filament sensor is off for this material)"
        {% endif %}
    {% elif v.busy|int == 1 %}
        RESPOND MSG="OSS: button ignored, a load or unload is still running"
    {% elif v.unload_button|int == 1 %}
        {% set heater_was_off = printer.print_stats.state != "paused" and printer.extruder.target == 0 %}
        SET_GCODE_VARIABLE MACRO=_OSS_VARS VARIABLE=busy VALUE=1
        RESPOND MSG="OSS: unload button pressed, unloading"
        UNLOAD_FILAMENT
        {% if heater_was_off %}
            M104 S0
        {% endif %}
        UPDATE_DELAYED_GCODE ID=_OSS_CLEAR_BUSY DURATION=2
    {% else %}
        RESPOND MSG="OSS: button pressed (unload_button is 0, nothing done)"
    {% endif %}

# Cleared 2 s after a load or unload ends, so a button press queued during the
# move is still ignored when it finally runs.
[delayed_gcode _OSS_CLEAR_BUSY]
gcode:
    SET_GCODE_VARIABLE MACRO=_OSS_VARS VARIABLE=busy VALUE=0
