#################################################################################
#  Mellow FLY-LLL PLUS buffer + Orbiter 2 Smart Sensor (OSS) - Voron 2.4
#################################################################################
#
# Included on the LAST line of overrides.cfg:   [include lll_plus_oss.cfg]
# It must come after Klippain's files: it replaces Klippain's LOAD_FILAMENT and
# UNLOAD_FILAMENT (macros/helpers/filament_swap.cfg, left untouched because moonraker
# updates it) and Klippain's list of filament sensors.
# Pin aliases are in mcu.cfg: BUFFER_* on the Octopus Max, OSS_* on the EBB36 Gen2.
#
# Filament path:
#   spool -> LLL Plus (inlet sensor = runout_sensor) -> PTFE -> OSS (oss_sensor) -> Orbiter 2.5
#
# Commands:
#   LOAD_FILAMENT    The buffer feeds until the OSS sees the filament, then stops, and the
#                    extruder loads and purges (Klippain's moves). The command returns while
#                    the buffer is still feeding: wait for "OSS: filament loaded" before
#                    RESUME. If the OSS sees nothing within load_timeout the feed stops.
#                    With the OSS disabled (TPU: 'filament_sensor': 0 in variables.cfg) it
#                    falls back to a timed buffer feed (feed_time).
#   UNLOAD_FILAMENT  Toolhead unload with the buffer retracting at the same time, then a
#                    check that the OSS no longer sees filament.
#   OSS button       Not printing (idle or paused): UNLOAD_FILAMENT, only if the OSS sees
#                    filament. While printing the same signal means a tangle: PAUSE.
#   BUFFER_STOP      Stops the buffer and cancels a pending load. Use it as a reset.
#   BUFFER_FEED / BUFFER_RETRACT   Run the buffer motor by hand (stop with BUFFER_STOP).
#   M600 / M701 / M702 go through Klippain to these same macros.
#
# First test after installing (the hotend can stay cold, nothing heats up):
#   1. No filament in the OSS:  QUERY_FILAMENT_SENSOR SENSOR=oss_sensor
#      -> "filament not detected"
#   2. Still no filament, press the OSS button
#      -> "OSS: no filament at the extruder inlet, nothing to unload..."
#   3. Push filament into the OSS by hand
#      -> "OSS: filament detected at the extruder inlet"
#      and QUERY_FILAMENT_SENSOR SENSOR=oss_sensor -> "filament detected"
#   If step 2 prints "filament detected" and step 3 prints "nothing to unload", the FS and
#   FTU wires are swapped: swap MCU_I2C_SCL / MCU_I2C_SDA on the OSS line in mcu.cfg.
#   If a sensor reads the opposite of reality on both steps, add "!" to its pin below.


#--------------------------------------#
#   FILAMENT SENSORS FOR KLIPPAIN      #
#--------------------------------------#
## Klippain switches every sensor in this list together: per material in START_PRINT
## ('filament_sensor' in variables.cfg), around its load/unload/purge/brush moves, and back
## on in END_PRINT / CANCEL_PRINT. Its startup check fails if a name here does not exist.
##   runout_sensor = LLL Plus inlet (Klippain's own sensor, port FWS0)
##   oss_sensor    = OSS on the extruder (defined below)
[gcode_macro _USER_VARIABLES]
variable_filament_sensor_names: "runout_sensor", "oss_sensor"
gcode: # do not remove this line


#--------------------------------------#
#   SETTINGS (one place to tune)       #
#--------------------------------------#
[gcode_macro _BUFFER_VARS]
description: Settings for the LLL Plus buffer + Orbiter Smart Sensor
## 0 = LOAD/UNLOAD_FILAMENT ignore the buffer
variable_buffer_enabled: 1
## ms the buffer keeps retracting AFTER the toolhead unload move
variable_retract_time: 8000
## ms of timed buffer feed, only used when the OSS is disabled or missing
variable_feed_time: 5000
## s, longest the buffer may feed while waiting for the OSS
variable_load_timeout: 60
## 1 = filament pushed into the buffer inlet or into the OSS starts LOAD_FILAMENT by itself.
##     It heats the hotend with nobody clicking anything (and turns it off again after,
##     unless the print is paused).
variable_auto_load: 0
## 1 = the OSS button runs UNLOAD_FILAMENT when not printing
variable_unload_button: 1
## 1 = pause the print when the OSS reports a tangle
variable_tangle_pause: 1
## Sensor section names ("" disables the matching checks)
variable_buffer_sensor: "runout_sensor"
variable_oss_sensor: "oss_sensor"
gcode:

[gcode_macro _OSS_STATE]
description: Internal state of the buffer + OSS filament handling (do not edit)
variable_busy: 0
variable_load_pending: 0
variable_load_temp: 0
variable_load_distance: 0
variable_load_heater_off: 0
gcode:


#----------------------------#
#       LLL Plus Buffer      #
#----------------------------#
# Aliases (mcu.cfg) on this machine:
#   BUFFER_FEED_BUTTON    = MCU_STOP3 (PF3)  <- buffer FEED button output
#   BUFFER_RETRACT_BUTTON = MCU_STOP2 (PF4)  <- buffer RETRACT button output
#   BUFFER_FEED_SIGNAL    = MCU_STOP4 (PF1)  -> buffer PB5, low = keep feeding
#   BUFFER_RETRACT_SIGNAL = MCU_STOP5 (PC15) -> buffer PB6, low = keep retracting
#   buffer SIGNAL wire (filament at the inlet) = RUNOUT_SENSOR (MCU_FWS0, PC0)
#                                              = Klippain's [filament_switch_sensor runout_sensor]
# Per the Mellow docs PB5/PB6 act for as long as the pin is held low and stop when it goes
# high again. Nothing reports back from the buffer, so the OSS is the "filament arrived"
# signal.
#
# Button polarity: the Mellow docs give ^BUFFER_FEED_BUTTON (no "!") for feed and
# ^!BUFFER_RETRACT_BUTTON for retract. This machine runs ^! on both and it works, so that is
# kept. If the FEED button reacts about 3 s late, fires when released, or fires once at
# every Klipper restart, remove the "!" from manual_feed.

[output_pin _buffer_feed]
pin: BUFFER_FEED_SIGNAL
value: 1           # high = idle
shutdown_value: 1  # stay idle when Klipper stops

[output_pin _buffer_retract]
pin: BUFFER_RETRACT_SIGNAL
value: 1
shutdown_value: 1

[gcode_button manual_feed]
pin: ^!BUFFER_FEED_BUTTON
press_gcode:
    _BUFFER_BUTTON_MOVE E=10

[gcode_button manual_retract]
pin: ^!BUFFER_RETRACT_BUTTON
press_gcode:
    _BUFFER_BUTTON_MOVE E=-5

## The buttons used to send G91 / G1 E10 / G90 unconditionally: mid-print that injects an
## extrusion into the print, and with a cold hotend it raised "Extrude below minimum temp".
[gcode_macro _BUFFER_BUTTON_MOVE]
description: Extruder move that follows the buffer FEED / RETRACT buttons, only when safe
gcode:
    {% set E = params.E|default(0)|float %}
    {% if printer.print_stats.state == "printing" %}
        RESPOND MSG="Buffer button: extruder not moved while printing"
    {% elif printer["gcode_macro _OSS_STATE"].busy|int %}
        RESPOND MSG="Buffer button: extruder not moved, a filament load/unload is running"
    {% elif not printer.extruder.can_extrude %}
        RESPOND MSG="Buffer button: hotend below min_extrude_temp, extruder not moved"
    {% else %}
        SAVE_GCODE_STATE NAME=_buffer_button_state
        M83
        G1 E{E} F300
        RESTORE_GCODE_STATE NAME=_buffer_button_state
        RESPOND MSG="Buffer button: extruder moved {E} mm"
    {% endif %}

[gcode_macro BUFFER_FEED]
description: Buffer motor feeds until BUFFER_STOP
gcode:
    SET_PIN PIN=_buffer_retract VALUE=1
    SET_PIN PIN=_buffer_feed VALUE=0
    M118 Buffer started feeding

[gcode_macro BUFFER_RETRACT]
description: Buffer motor retracts until BUFFER_STOP
gcode:
    SET_PIN PIN=_buffer_feed VALUE=1
    SET_PIN PIN=_buffer_retract VALUE=0
    M118 Buffer started retracting

[gcode_macro BUFFER_STOP]
description: Stop the buffer and cancel a pending filament load (use it as a reset)
gcode:
    {% set st = printer["gcode_macro _OSS_STATE"] %}
    _BUFFER_HALT
    {% if st.load_pending|int and st.load_heater_off|int %}
        M104 S0
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_OSS_STATE VARIABLE=load_heater_off VALUE=0
    SET_GCODE_VARIABLE MACRO=_OSS_STATE VARIABLE=busy VALUE=0
    M118 Buffer stopped

[gcode_macro _BUFFER_HALT]
description: Internal - buffer motor off and pending load cancelled (no message, no heater change)
gcode:
    SET_PIN PIN=_buffer_feed VALUE=1
    SET_PIN PIN=_buffer_retract VALUE=1
    UPDATE_DELAYED_GCODE ID=_buffer_load_timeout DURATION=0
    SET_GCODE_VARIABLE MACRO=_OSS_STATE VARIABLE=load_pending VALUE=0

[delayed_gcode _buffer_load_timeout]
gcode:
    _BUFFER_LOAD_TIMEOUT

## Called through a macro (not inline in the delayed_gcode) so the decision is made when
## it actually runs, after anything that finished in the meantime.
[gcode_macro _BUFFER_LOAD_TIMEOUT]
description: Internal - stop the buffer if the OSS never saw the filament arrive
gcode:
    {% set st = printer["gcode_macro _OSS_STATE"] %}
    {% set t = printer["gcode_macro _BUFFER_VARS"].load_timeout|int %}
    {% if st.load_pending|int %}
        _BUFFER_HALT
        {% if st.load_heater_off|int %}
            M104 S0
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_OSS_STATE VARIABLE=load_heater_off VALUE=0
        SET_GCODE_VARIABLE MACRO=_OSS_STATE VARIABLE=busy VALUE=0
        RESPOND TYPE=error MSG="Buffer: the OSS saw no filament after {t} s, feed stopped. Check the PTFE path, then LOAD_FILAMENT again"
    {% endif %}


#----------------------------------#
#   ORBITER 2 SMART SENSOR (OSS)   #
#----------------------------------#
# Aliases (mcu.cfg), EBB36 Gen2 I2C port:
#   OSS_SENSOR = MCU_I2C_SCL (PA7) <- OSS "FS":  high = filament at the extruder inlet
#   OSS_BUTTON = MCU_I2C_SDA (PA6) <- OSS "FTU": high = unload button, or while printing a
#                                     tangle (pull force over about 2 kg for 1 s)
# The OSS's own MCU filters and drives both lines and the EBB36 Gen2 has pull-ups on its I2C
# lines, so no ^ or ! here. The vendor's Orbiter2_SmartSensor.cfg is NOT used: it redefines
# PAUSE / RESUME / CANCEL_PRINT on top of Klippain's and has its own load/unload that would
# bypass the buffer and the purge bucket.

[filament_switch_sensor oss_sensor]
switch_pin: toolhead:OSS_SENSOR
pause_on_runout: True
runout_gcode:
    RESPOND TYPE=error MSG="OSS: no filament at the extruder inlet - print paused"
insert_gcode:
    _OSS_INSERT
event_delay: 0.1   # the OSS already filters its signal on board (about 1 s)
pause_delay: 0.1

## Adds an insert action to Klippain's own runout_sensor (the buffer inlet).
[filament_switch_sensor runout_sensor]
insert_gcode:
    _BUFFER_INSERT

## press_gcode is rendered at the moment of the press, so a press during a load/unload is
## caught right away. The tangle check comes first, so a stuck "busy" flag can never
## switch off tangle detection while printing.
[gcode_button oss_button]
pin: toolhead:OSS_BUTTON
press_gcode:
    {% if printer.print_stats.state == "printing" %}
        _OSS_TANGLE
    {% elif printer["gcode_macro _OSS_STATE"].busy|int %}
        RESPOND MSG="OSS: button ignored, a filament load/unload is running (BUFFER_STOP resets it)"
    {% else %}
        _OSS_UNLOAD_BUTTON
    {% endif %}

[gcode_macro _OSS_TANGLE]
description: Internal - OSS FTU signal while printing = filament tangle
gcode:
    {% if printer["gcode_macro _BUFFER_VARS"].tangle_pause|int %}
        RESPOND TYPE=error MSG="OSS: filament tangle detected - print paused"
        PAUSE
    {% else %}
        RESPOND MSG="OSS: tangle signal ignored (tangle_pause is 0)"
    {% endif %}

[gcode_macro _OSS_UNLOAD_BUTTON]
description: Internal - OSS button while not printing = unload, only if the OSS sees filament
gcode:
    {% set cfg = printer["gcode_macro _BUFFER_VARS"] %}
    {% set oobj = "filament_switch_sensor " ~ cfg.oss_sensor %}
    {% set have_oss = cfg.oss_sensor != "" and (oobj|lower) in printer.configfile.settings %}
    {% if not cfg.unload_button|int %}
        RESPOND MSG="OSS: button pressed (unload_button is 0, nothing done)"
    {% elif printer["gcode_macro _OSS_STATE"].busy|int %}
        RESPOND MSG="OSS: button ignored, a filament load/unload is running (BUFFER_STOP resets it)"
    {% elif have_oss and not printer[oobj].filament_detected %}
        RESPOND MSG="OSS: no filament at the extruder inlet, nothing to unload. Use UNLOAD_FILAMENT for a short leftover piece"
    {% else %}
        {% set heater_was_off = printer.print_stats.state != "paused" and printer.extruder.target == 0 %}
        RESPOND MSG="OSS: unload button pressed - unloading"
        UNLOAD_FILAMENT
        {% if heater_was_off %}
            M104 S0
            RESPOND MSG="OSS: hotend turned off again (it was off before the unload)"
        {% endif %}
    {% endif %}

[gcode_macro _OSS_INSERT]
description: Internal - the OSS saw filament arrive at the extruder inlet
gcode:
    {% set st = printer["gcode_macro _OSS_STATE"] %}
    {% set cfg = printer["gcode_macro _BUFFER_VARS"] %}
    {% if st.load_pending|int %}
        RESPOND MSG="OSS: filament reached the extruder"
        _LOAD_FILAMENT_EXTRUDE TEMP={st.load_temp} DISTANCE={st.load_distance} HEATER_OFF={st.load_heater_off}
    {% elif cfg.auto_load|int and st.busy|int == 0 and printer.print_stats.state != "printing" %}
        RESPOND MSG="OSS: filament inserted at the extruder inlet - auto load"
        LOAD_FILAMENT HEATER_OFF={1 if printer.print_stats.state != "paused" and printer.extruder.target == 0 else 0}
    {% else %}
        RESPOND MSG="OSS: filament detected at the extruder inlet"
    {% endif %}

[gcode_macro _BUFFER_INSERT]
description: Internal - filament was pushed into the buffer inlet
gcode:
    {% if printer["gcode_macro _BUFFER_VARS"].auto_load|int and printer["gcode_macro _OSS_STATE"].busy|int == 0 and printer.print_stats.state != "printing" %}
        RESPOND MSG="Buffer: filament inserted at the buffer inlet - auto load"
        LOAD_FILAMENT HEATER_OFF={1 if printer.print_stats.state != "paused" and printer.extruder.target == 0 else 0}
    {% else %}
        RESPOND MSG="Buffer: filament detected at the buffer inlet"
    {% endif %}


#--------------------------------------#
#   SENSOR REPORTS                     #
#--------------------------------------#
## Each report is its own macro on purpose: Klipper renders a macro template once, before
## running any of its commands, so a sensor read placed inside UNLOAD_FILAMENT would show
## the state from BEFORE the moves. A separate call is rendered when it is reached.
[gcode_macro _BUFFER_CHECK]
description: Report the filament state at the buffer inlet
gcode:
    {% set mode = params.MODE|default("info")|string %}
    {% set bname = printer["gcode_macro _BUFFER_VARS"].buffer_sensor %}
    {% set have_bsensor = bname != "" and ("filament_switch_sensor " ~ bname|lower) in printer.configfile.settings %}
    {% if have_bsensor %}
        {% set detected = printer["filament_switch_sensor " ~ bname].filament_detected %}
        {% if mode == "unload" %}
            {% if detected %}
                RESPOND MSG="Buffer: filament still in the buffer - pull it out by hand to swap the spool"
            {% else %}
                RESPOND MSG="Buffer: inlet clear, filament is out"
            {% endif %}
        {% elif mode == "load" %}
            {% if detected %}
                RESPOND MSG="Buffer: filament present at the inlet, feeding"
            {% else %}
                RESPOND MSG="Buffer: WARNING - no filament at the buffer inlet, the feed will do nothing"
            {% endif %}
        {% else %}
            RESPOND MSG="Buffer inlet: {'filament detected' if detected else 'no filament'}"
        {% endif %}
    {% elif mode == "info" %}
        RESPOND MSG="Buffer: no inlet sensor configured (see variable_buffer_sensor in _BUFFER_VARS)"
    {% endif %}

[gcode_macro _OSS_CHECK]
description: Report the filament state at the OSS (extruder inlet)
gcode:
    {% set mode = params.MODE|default("info")|string %}
    {% set oname = printer["gcode_macro _BUFFER_VARS"].oss_sensor %}
    {% set have_oss = oname != "" and ("filament_switch_sensor " ~ oname|lower) in printer.configfile.settings %}
    {% if have_oss %}
        {% set detected = printer["filament_switch_sensor " ~ oname].filament_detected %}
        {% if mode == "unload" %}
            {% if detected %}
                RESPOND TYPE=error MSG="OSS: WARNING - filament still at the extruder inlet, the unload may have failed"
            {% else %}
                RESPOND MSG="OSS: extruder clear"
            {% endif %}
        {% elif mode == "load" %}
            {% if detected %}
                RESPOND MSG="OSS: filament loaded"
            {% else %}
                RESPOND TYPE=error MSG="OSS: WARNING - no filament at the extruder inlet after loading"
            {% endif %}
        {% else %}
            RESPOND MSG="OSS: {'filament detected' if detected else 'no filament'}"
        {% endif %}
    {% elif mode == "info" %}
        RESPOND MSG="OSS: no sensor configured (see variable_oss_sensor in _BUFFER_VARS)"
    {% endif %}


#--------------------------------------#
#   FILAMENT SWAP (Klippain overrides) #
#--------------------------------------#
## UNLOAD_FILAMENT and LOAD_FILAMENT replace the ones from Klippain's
## macros/helpers/filament_swap.cfg; the toolhead moves are Klippain's, unchanged.
## Klippain's _KLIPPAIN_DISABLE/ENABLE_FILAMENT_SENSORS remember which sensors were on
## (TPU keeps them off) and nest safely with _TIP_SHAPING. During the buffer-feed phase of
## a load the OSS stays enabled on purpose: its insert event starts the extruder part.

[gcode_macro UNLOAD_FILAMENT]
description: Unload the filament (M702, M600/CHANGE_FILAMENT) - the LLL Plus buffer retracts at the same time
gcode:
    {% set TEMP = params.TEMP|default(printer["gcode_macro _USER_VARIABLES"].print_default_extruder_temp)|float %}
    {% set DISTANCE = params.DISTANCE|default(105)|float %}
    {% set MAX_E = printer.configfile.settings.extruder.max_extrude_only_distance|float %}
    {% if DISTANCE > MAX_E %}
        { action_raise_error("UNLOAD_FILAMENT: DISTANCE=%.1f is longer than max_extrude_only_distance (%.1f)" % (DISTANCE, MAX_E)) }
    {% endif %}

    {% set verbose = printer["gcode_macro _USER_VARIABLES"].verbose %}
    {% set filament_sensor_enabled = printer["gcode_macro _USER_VARIABLES"].filament_sensor_enabled|default(False) %}
    ## klippain_mmu_enabled only exists when config/hardware/mmu.cfg is included (not here)
    {% set klippain_mmu_enabled = printer["gcode_macro _USER_VARIABLES"].klippain_mmu_enabled|default(False) %}

    {% set cfg = printer["gcode_macro _BUFFER_VARS"] %}
    {% set buffer_enabled = cfg.buffer_enabled|int %}
    {% set BUFFER_RETRACT_TIME = params.BUFFER_RETRACT_TIME|default(cfg.retract_time)|int %}

    _BUFFER_HALT
    SET_GCODE_VARIABLE MACRO=_OSS_STATE VARIABLE=load_heater_off VALUE=0
    SET_GCODE_VARIABLE MACRO=_OSS_STATE VARIABLE=busy VALUE=1

    {% if filament_sensor_enabled %}
        _KLIPPAIN_DISABLE_FILAMENT_SENSORS
        {% if verbose %}
            RESPOND MSG="Filament sensors deactivated to unload filament"
        {% endif %}
    {% endif %}

    {% if klippain_mmu_enabled %}
        {% set was_clog_detection = printer.mmu.clog_detection %}
        _KLIPPAIN_MMU_SET_CLOGDETECTION STATE=0
    {% endif %}

    SAVE_GCODE_STATE NAME=UNLOAD_FILAMENT_state
    _LOW_TEMP_CHECK T={TEMP}

    _TIP_SHAPING

    {% if buffer_enabled %}
        BUFFER_RETRACT
    {% endif %}

    M83
    G1 E-20 F3600
    G4 P3000
    G1 E-{DISTANCE} F3000

    # Flushing Klipper's buffer to ensure the unload is done before continuing
    M400

    {% if buffer_enabled %}
        G4 P{BUFFER_RETRACT_TIME}
    {% endif %}
    _BUFFER_HALT

    {% if buffer_enabled %}
        _BUFFER_CHECK MODE=unload
    {% endif %}
    _OSS_CHECK MODE=unload

    RESTORE_GCODE_STATE NAME=UNLOAD_FILAMENT_state

    {% if filament_sensor_enabled %}
        _KLIPPAIN_ENABLE_FILAMENT_SENSORS
        {% if verbose %}
            RESPOND MSG="Filament unloaded, filament sensors reactivated"
        {% endif %}
    {% endif %}

    {% if klippain_mmu_enabled %}
        _KLIPPAIN_MMU_SET_CLOGDETECTION STATE={was_clog_detection}
    {% endif %}

    SET_GCODE_VARIABLE MACRO=_OSS_STATE VARIABLE=busy VALUE=0


## LOAD_FILAMENT only decides HOW to load. The extruder part is _LOAD_FILAMENT_EXTRUDE,
## started by the OSS insert event once the filament has arrived.
[gcode_macro LOAD_FILAMENT]
description: Load filament (M701, after M600) - the buffer feeds until the OSS sees filament, then the extruder loads and purges
gcode:
    {% set TEMP = params.TEMP|default(printer["gcode_macro _USER_VARIABLES"].print_default_extruder_temp)|float %}
    {% set DISTANCE = params.DISTANCE|default(105)|float %}
    {% set HEATER_OFF = params.HEATER_OFF|default(0)|int %}
    {% set MAX_E = printer.configfile.settings.extruder.max_extrude_only_distance|float %}
    {% set MIN_EXTRUDE_TEMP = printer.configfile.settings.extruder.min_extrude_temp|float %}
    {% if DISTANCE > MAX_E %}
        { action_raise_error("LOAD_FILAMENT: DISTANCE=%.1f is longer than max_extrude_only_distance (%.1f)" % (DISTANCE, MAX_E)) }
    {% endif %}

    {% set cfg = printer["gcode_macro _BUFFER_VARS"] %}
    {% set st = printer["gcode_macro _OSS_STATE"] %}
    {% set buffer_enabled = cfg.buffer_enabled|int %}
    {% set BUFFER_FEED_TIME = params.BUFFER_FEED_TIME|default(cfg.feed_time)|int %}

    {% set oobj = "filament_switch_sensor " ~ cfg.oss_sensor %}
    {% set have_oss = cfg.oss_sensor != "" and (oobj|lower) in printer.configfile.settings %}
    {% set oss_ready = have_oss and printer[oobj].enabled %}
    {% set oss_sees_filament = have_oss and printer[oobj].filament_detected %}

    {% set bobj = "filament_switch_sensor " ~ cfg.buffer_sensor %}
    {% set have_bsensor = cfg.buffer_sensor != "" and (bobj|lower) in printer.configfile.settings %}
    {% set buffer_empty = have_bsensor and not printer[bobj].filament_detected %}

    {% if st.busy|int %}
        RESPOND MSG="Filament: a load/unload is already running (BUFFER_STOP cancels it)"

    {% elif oss_sees_filament or not buffer_enabled %}
        ## Filament already at the extruder (or buffer not used): extruder part only
        _LOAD_FILAMENT_EXTRUDE TEMP={TEMP} DISTANCE={DISTANCE} HEATER_OFF={HEATER_OFF}

    {% elif oss_ready %}
        {% if buffer_empty %}
            RESPOND TYPE=error MSG="Buffer: no filament at the buffer inlet - push the new filament into the buffer first"
        {% else %}
            SET_GCODE_VARIABLE MACRO=_OSS_STATE VARIABLE=load_temp VALUE={TEMP}
            SET_GCODE_VARIABLE MACRO=_OSS_STATE VARIABLE=load_distance VALUE={DISTANCE}
            SET_GCODE_VARIABLE MACRO=_OSS_STATE VARIABLE=load_heater_off VALUE={HEATER_OFF}
            SET_GCODE_VARIABLE MACRO=_OSS_STATE VARIABLE=load_pending VALUE=1
            SET_GCODE_VARIABLE MACRO=_OSS_STATE VARIABLE=busy VALUE=1
            {% if printer.extruder.target < MIN_EXTRUDE_TEMP %}
                M104 S{TEMP}
            {% endif %}
            BUFFER_FEED
            UPDATE_DELAYED_GCODE ID=_buffer_load_timeout DURATION={cfg.load_timeout|int}
            RESPOND MSG="Buffer: feeding until the OSS sees filament - wait for 'OSS: filament loaded' before RESUME"
        {% endif %}

    {% else %}
        ## OSS not usable (disabled, e.g. TPU, or not configured): timed buffer feed
        _BUFFER_CHECK MODE=load
        SET_GCODE_VARIABLE MACRO=_OSS_STATE VARIABLE=busy VALUE=1
        {% if printer.extruder.target < MIN_EXTRUDE_TEMP %}
            M104 S{TEMP}
        {% endif %}
        BUFFER_FEED
        G4 P{BUFFER_FEED_TIME}
        _BUFFER_HALT
        _LOAD_FILAMENT_EXTRUDE TEMP={TEMP} DISTANCE={DISTANCE} HEATER_OFF={HEATER_OFF}
    {% endif %}


[gcode_macro _LOAD_FILAMENT_EXTRUDE]
description: Internal - second half of LOAD_FILAMENT - stop the buffer, then Klippain's extruder load and purge
gcode:
    {% set TEMP = params.TEMP|default(printer["gcode_macro _USER_VARIABLES"].print_default_extruder_temp)|float %}
    {% set DISTANCE = params.DISTANCE|default(105)|float %}
    {% set HEATER_OFF = params.HEATER_OFF|default(0)|int %}

    {% set verbose = printer["gcode_macro _USER_VARIABLES"].verbose %}
    {% set filament_sensor_enabled = printer["gcode_macro _USER_VARIABLES"].filament_sensor_enabled|default(False) %}
    {% set klippain_mmu_enabled = printer["gcode_macro _USER_VARIABLES"].klippain_mmu_enabled|default(False) %}

    _BUFFER_HALT
    SET_GCODE_VARIABLE MACRO=_OSS_STATE VARIABLE=busy VALUE=1

    {% if filament_sensor_enabled %}
        _KLIPPAIN_DISABLE_FILAMENT_SENSORS
        {% if verbose %}
            RESPOND MSG="Filament sensors deactivated to load filament"
        {% endif %}
    {% endif %}

    {% if klippain_mmu_enabled %}
        {% set was_clog_detection = printer.mmu.clog_detection %}
        _KLIPPAIN_MMU_SET_CLOGDETECTION STATE=0
    {% endif %}

    SAVE_GCODE_STATE NAME=LOAD_FILAMENT_state
    _LOW_TEMP_CHECK T={TEMP}
    M83
    G92 E0
    G1 E{DISTANCE} F200
    G1 E50 F150

    # Flushing Klipper's buffer to ensure the load is done before continuing
    M400

    G92 E0
    RESTORE_GCODE_STATE NAME=LOAD_FILAMENT_state

    {% if filament_sensor_enabled %}
        _KLIPPAIN_ENABLE_FILAMENT_SENSORS
        {% if verbose %}
            RESPOND MSG="Filament loaded, filament sensors reactivated"
        {% endif %}
    {% endif %}

    {% if klippain_mmu_enabled %}
        _KLIPPAIN_MMU_SET_CLOGDETECTION STATE={was_clog_detection}
    {% endif %}

    {% if HEATER_OFF %}
        M104 S0
        RESPOND MSG="Filament: hotend turned off again (it was off before the auto load)"
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_OSS_STATE VARIABLE=load_heater_off VALUE=0
    SET_GCODE_VARIABLE MACRO=_OSS_STATE VARIABLE=busy VALUE=0
    _OSS_CHECK MODE=load
