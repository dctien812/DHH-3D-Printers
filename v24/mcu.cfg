#------------------------------------------#
#### BTT Octopus Max MCU definition ########
#------------------------------------------#

[mcu]
##--------------------------------------------------------------------
# This board work by using a serial connection by default. If you
# want to use CAN, invert the commented lines and use canbus_uuid.

# serial: /dev/serial/by-id/change-me-to-the-correct-mcu-path
canbus_uuid: 9cf7e480ee63
##--------------------------------------------------------------------

[include config/mcu_definitions/main/BTT_Octopus_Max.cfg] # Do not remove this line
[board_pins octopus_max_mcu]
mcu: mcu
aliases:
    X_STEP=MCU_MOTOR0_STEP   , X_DIR=MCU_MOTOR0_DIR   , X_ENABLE=MCU_MOTOR0_ENABLE   , X_TMCUART=MCU_MOTOR0_UART   ,
    Y_STEP=MCU_MOTOR1_STEP   , Y_DIR=MCU_MOTOR1_DIR   , Y_ENABLE=MCU_MOTOR1_ENABLE   , Y_TMCUART=MCU_MOTOR1_UART   ,

    Z_STEP=MCU_MOTOR2_1_STEP , Z_DIR=MCU_MOTOR2_1_DIR , Z_ENABLE=MCU_MOTOR2_1_ENABLE , Z_TMCUART=MCU_MOTOR2_1_UART ,
    Z1_STEP=MCU_MOTOR4_STEP  , Z1_DIR=MCU_MOTOR4_DIR  , Z1_ENABLE=MCU_MOTOR4_ENABLE  , Z1_TMCUART=MCU_MOTOR4_UART  ,
    Z2_STEP=MCU_MOTOR5_STEP  , Z2_DIR=MCU_MOTOR5_DIR  , Z2_ENABLE=MCU_MOTOR5_ENABLE  , Z2_TMCUART=MCU_MOTOR5_UART  ,
    Z3_STEP=MCU_MOTOR6_STEP  , Z3_DIR=MCU_MOTOR6_DIR  , Z3_ENABLE=MCU_MOTOR6_ENABLE  , Z3_TMCUART=MCU_MOTOR6_UART  ,

    E_STEP=MCU_MOTOR7_STEP   , E_DIR=MCU_MOTOR7_DIR   , E_ENABLE=MCU_MOTOR7_ENABLE   , E_TMCUART=MCU_MOTOR7_UART   ,

    DRIVER_SPI_MOSI=MCU_SPI4_MOSI , # Used in case of SPI drivers such as TMC2240 or TMC5160
    DRIVER_SPI_MISO=MCU_SPI4_MISO , # Used in case of SPI drivers such as TMC2240 or TMC5160
    DRIVER_SPI_SCK=MCU_SPI4_SCK   , # Used in case of SPI drivers such as TMC2240 or TMC5160

    X_STOP=MCU_STOP0       , Y_STOP=MCU_STOP1 ,
    RUNOUT_SENSOR=MCU_FWS0 , MOTION_SENSOR=MCU_FWS1 ,

    E_HEATER=MCU_HE0   ,
    BED_HEATER=MCU_HE1 , BED_TEMPERATURE=MCU_TB ,

    PART_FAN=MCU_FAN0              , E_FAN=MCU_FAN1 ,
    CONTROLLER_FAN=MCU_FAN2        ,
    EXHAUST_FAN=MCU_FAN3           ,
    FILTER_FAN=MCU_HE3             ,    HOST_CONTROLLER_FAN=MCU_FAN5   ,

    CHAMBER_TEMPERATURE=MCU_T0 , ELECTRICAL_CABINET_TEMPERATURE=MCU_T2 ,

    LIGHT_OUTPUT=MCU_HE2         ,
    LIGHT_NEOPIXEL=MCU_NEOPIXEL2   ,
    STATUS_NEOPIXEL=MCU_NEOPIXEL ,

    SERVO_PIN=MCU_SERVOS ,

    # Mellow FLY-LLL PLUS buffer, wired to four spare endstop ports.
    # Mainboard outputs -> buffer PB5 / PB6 (low = keep feeding / retracting):
    BUFFER_FEED_SIGNAL=MCU_STOP4   , BUFFER_RETRACT_SIGNAL=MCU_STOP5 ,
    # Buffer FEED / RETRACT button outputs -> mainboard inputs:
    BUFFER_FEED_BUTTON=MCU_STOP3   , BUFFER_RETRACT_BUTTON=MCU_STOP2 ,
    # The buffer SIGNAL wire (filament present at the buffer inlet) goes to the
    # FWS0 port, which is already aliased as RUNOUT_SENSOR above and used by
    # Klippain as [filament_switch_sensor runout_sensor].
    # Do NOT use MCU_STOP6 / MCU_STOP7: in the Octopus Max definition they are
    # the same pins as MCU_MOTOR0_UART (X driver UART) and MCU_MOTOR5_STEP (Z2 step).

#--------------------------------------------#
#### BTT EBB36 GEN2 v1.0 MCU definition ######
#--------------------------------------------#

[mcu toolhead]
##--------------------------------------------------------------------
# serial: /dev/serial/by-id/usb-Klipper_Klipper_firmware_12345-if00
canbus_uuid: 57cb6fdc233b
##--------------------------------------------------------------------

# If you want to override the wiring of the BTT EBB36 GEN2, keep in mind that this
# board is defined using the "toolhead" name. So you should use "pin: toolhead:PIN_NAME"
# in your own overrides.cfg files.

[include config/mcu_definitions/toolhead/BTT_EBB36_GEN2_v1.0.cfg] # Do not remove this line
[board_pins ebb36_gen2_mcu]
mcu: toolhead
aliases:
    E_STEP=MCU_TMCDRIVER_STEP , E_DIR=MCU_TMCDRIVER_DIR , E_ENABLE=MCU_TMCDRIVER_ENABLE , E_TMCUART=MCU_TMCDRIVER_UART ,

    X_STOP=MCU_ENDSTOP ,
    PROBE_INPUT=MCU_PROBE ,
    TOOLHEAD_SENSOR=MCU_FILAMENT_SENSOR ,

    E_HEATER=MCU_HOTEND0 , E_TEMPERATURE=MCU_TH0 ,
    TOOLHEAD_TEMPERATURE=MCU_BOARD_TEMP ,

    PART_FAN=MCU_FAN1 , E_FAN=MCU_FAN3 , E_FAN_TACHO=MCU_FAN3_TACH ,
    AUX_FAN=MCU_FAN2 ,

    STATUS_NEOPIXEL=MCU_RGB ,

    LIS2DW_CS=MCU_SPI2_CS ,

    # Orbiter v2 Smart Sensor (OSS) on the I2C port (5V / GND / SCL / SDA):
    # FS (filament at the extruder inlet) on SCL, FTU (unload button / tangle) on SDA.
    # On this board SCL and SDA go through 470R series resistors and Schottky clamps
    # to 3.3V (BTT schematic), so the sensor's 5V outputs are safe for the MCU.
    # If the first test at the top of lll_plus_oss.cfg shows FS and FTU swapped,
    # swap MCU_I2C_SCL and MCU_I2C_SDA on this line - nothing else needs changing.
    OSS_SENSOR=MCU_I2C_SCL , OSS_BUTTON=MCU_I2C_SDA ,


#----------------------------------------#
#    BTT EBB36 GEN2 v1.0 pins remapping  #
#----------------------------------------#

# These pins overrides are automatically added when you select a CANbus
# toolhead MCU during the installation process. They should provide a
# good base to work with. Feel free to adapt to your board if needed!

[extruder]
step_pin: toolhead:E_STEP
dir_pin: toolhead:E_DIR
enable_pin: !toolhead:E_ENABLE
heater_pin: toolhead:E_HEATER
sensor_pin: toolhead:E_TEMPERATURE
pullup_resistor: 2200

#[probe]
#pin: ^toolhead:PROBE_INPUT

#[fan]
#pin: toolhead:PART_FAN

## Part cooling runs PART_FAN (FAN1) and AUX_FAN (FAN2) together. The matching
## [multi_pin dual_part_fan] section is in printer.cfg (FANS block) and must stay there:
## Klipper has to load it before [fan], which Klippain first defines in part_fan.cfg.
[fan]
pin: multi_pin:dual_part_fan

[heater_fan hotend_fan]
pin: toolhead:E_FAN

## Uncomment the following line if not using sensorless homing
## and having the X endstop plugged to the toolhead MCU
[stepper_x]
endstop_pin: ^toolhead:X_STOP

[neopixel status_leds]
pin: toolhead:STATUS_NEOPIXEL

[tmc2209 extruder]
uart_pin: toolhead:E_TMCUART

[temperature_sensor ebb36_gen2_temp]
sensor_type: Generic 3950
sensor_pin: toolhead:TOOLHEAD_TEMPERATURE
pullup_resistor: 2200

